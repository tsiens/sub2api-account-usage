name: Release Windows App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --config.directories.output=release --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath 'release' -File -ErrorAction SilentlyContinue | Where-Object {
              $_.Extension -in @('.exe', '.blockmap') -or $_.Name -eq 'latest.yml'
            } | ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) {
            throw 'No Windows build assets were found in release'
          }
          $tagType = git cat-file -t $env:GITHUB_REF_NAME
          if ($tagType -ne 'tag') {
            throw "Release tag $env:GITHUB_REF_NAME must be an annotated tag with release notes"
          }
          $releaseNotes = (git for-each-ref "refs/tags/$env:GITHUB_REF_NAME" --format='%(contents)' | Out-String).Trim()
          if (-not $releaseNotes) {
            throw "Release tag $env:GITHUB_REF_NAME does not contain release notes"
          }
          $releaseId = gh release view $env:GITHUB_REF_NAME --json id --jq '.id' 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseId) {
            gh release edit $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes $releaseNotes
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --title $env:GITHUB_REF_NAME --notes $releaseNotes
          }
