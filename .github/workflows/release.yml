name: Release Windows App
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  release:
    needs: audit
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            xtask

      - name: Verify tag matches package version
        run: cargo xtask verify-tag

      - name: Rust format check
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path xtask/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path xtask/Cargo.toml --all-targets

      - name: Rust lint
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows installer
        run: cargo xtask build --skip-install

      - name: Prepare release assets
        run: cargo xtask prepare-release

      - name: Sign installer when certificate is configured
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: cargo xtask sign

      - name: Generate installer checksum
        run: cargo xtask checksum

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask publish
